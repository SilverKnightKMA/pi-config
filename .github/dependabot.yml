# Dependency auto-upgrade for pi-config.
# Covers every package.json in the repo — root (dev toolchain + test deps)
# and the three extensions that carry dependencies:
#   observational-memory (pi-coding-agent peer), visual-tools (mermaid-cli),
#   web-fetch (readability/linkedom/turndown/unpdf).
# ALL entries use package-ecosystem: bun (GA 2025-02): every dir is a member
# of the root bun workspace, so dependabot must update bun.lock alongside
# package.json or `bun install --frozen-lockfile` in CI rejects the PR
# ("lockfile had changes, but lockfile is frozen" — 18 red runs on 2026-09-07
# before this switch, incl. vitest 4→5 PRs #11/#12 that could never go green).
# The per-dir package-lock.json files are vestigial workspace members.
# NOTE: bun.lock is lockfileVersion 1 (bun 1.3.x). When local bun moves to
# 1.4+ the lock becomes v2 — dependabot bundles bun 1.3.14 and will reject
# v2 locks until dependabot-core#16071 rolls out; regenerate with care.
# Dependabot PRs are auto-merged by .github/workflows/auto-merge.yml once
# the bun-test CI gate (.github/workflows/ci.yml) is green.
version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"
    labels: [automated, dependencies]
    groups:
      root-dev-deps:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: bun
    directory: /extensions/observational-memory
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps om)"
    labels: [automated, dependencies]
  - package-ecosystem: bun
    directory: /extensions/visual-tools
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps visual-tools)"
    labels: [automated, dependencies]
    groups:
      visual-tools-deps:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: bun
    directory: /extensions/web-fetch
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps web-fetch)"
    labels: [automated, dependencies]
    groups:
      web-fetch-deps:
        patterns: ["*"]
        update-types: [minor, patch]
