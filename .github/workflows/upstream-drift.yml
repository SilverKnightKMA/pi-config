# Upstream drift tracker — mở issue khi upstream nhích so ref-đã-port trong registry.
# Đọc cột `endpoint` của docs/upstream-registry.md (định dạng npm:<pkg>@<ver> | gh:<owner>/<repo>@<sha7>).
# Drift  -> issue "[upstream-sync] <name>" (label upstream-sync, dedupe theo title, version nằm trong body)
# Hết drift (registry cập nhật ref sau sync-eval) -> tự đóng kèm comment.
# Issue là hàng đợi theo-dõi việc CHẾ ĐỘ 3 của skill pi-ext-eval: diff thật -> mini-brief -> user quyết -> cập nhật registry.
name: upstream-drift
on:
  schedule:
    - cron: "23 3 * * 1" # Monday 03:23 UTC (lệch giờ dependabot cho dàn trải)
  workflow_dispatch:

permissions:
  issues: write
  contents: read

concurrency:
  group: upstream-drift
  cancel-in-progress: false

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse registry + query upstreams -> drift.json
        env:
          GH_API_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - << 'PYEOF' > drift.json
          import json, re, urllib.request

          REG = "docs/upstream-registry.md"
          drift = {}

          def fetch_json(url):
              gh = "api.github.com" in url
              req = urllib.request.Request(url, headers={
                  "Accept": "application/vnd.github+json" if gh else "application/json",
                  "User-Agent": "upstream-drift-bot",
                  **({"Authorization": f"Bearer {__import__('os').environ['GH_API_TOKEN']}"} if gh else {}),
              })
              return json.load(urllib.request.urlopen(req, timeout=30))

          for line in open(REG, encoding="utf-8"):
              if not line.strip().startswith("|"):
                  continue
              cells = [c.strip() for c in line.strip().strip("|").split("|")]
              # cột endpoint là cột cuối; bỏ header + separator
              if len(cells) < 3 or set(cells[-1]) <= {"-", " "} or cells[-1] == "endpoint":
                  continue
              ext = cells[0].strip("`").replace("`", "")
              for raw_ep in cells[-1].split():
                  ep = raw_ep.strip("`")
                  m = re.match(r"^npm:(\S+)@(\S+)$", ep)
                  g = re.match(r"^gh:(\S+)@([0-9a-f]{7,40})$", ep)
                  if m:
                      name, ported = m.group(1), m.group(2)
                      latest = fetch_json(f"https://registry.npmjs.org/{urllib.parse.quote(name, safe='')}/latest")["version"]
                  elif g:
                      name, ported = g.group(1), g.group(2)[:7]
                      latest = fetch_json(f"https://api.github.com/repos/{name}/commits?per_page=1")[0]["sha"][:7]
                  else:
                      continue
                  if latest != ported:
                      d = drift.setdefault(name, {"name": name, "ported": ported, "latest": latest, "exts": []})
                      if ext not in d["exts"]:
                          d["exts"].append(ext)

          print(json.dumps(list(drift.values()), ensure_ascii=False, indent=2))
          PYEOF
          echo "--- drift detected ---"
          cat drift.json

      - name: Sync issues (mở/cập nhật khi drift, đóng khi hết)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # label phải tồn tại trước khi gh issue create dùng nó
          gh label create upstream-sync --color BFD4F2 --description "upstream nhích so ref đã port — chờ sync-eval chế độ 3" || true
          # map name -> issue number cho các issue upstream-sync đang mở
          declare -A OPEN
          while IFS=$'\t' read -r num title; do
            name=$(echo "$title" | sed -E 's/^\[upstream-sync\] //')
            OPEN["$name"]="$num"
          done < <(gh issue list --label upstream-sync --state open --limit 100 \
                   --json number,title --jq '.[] | [.number, .title] | @tsv')

          # mở / cập nhật theo drift (NAMES_JSON space-separated → for-loop word-split, KHÔNG while read từng dòng)
          NAMES_JSON=$(python3 -c 'import json;print(" ".join(d["name"] for d in json.load(open("drift.json"))))')
          for name in $NAMES_JSON; do
            [ -z "$name" ] && continue
            body=$(python3 -c "
          import json
          d=[x for x in json.load(open('drift.json')) if x['name']=='$name'][0]
          print(f\"Upstream **{d['name']}** nhích so ref đã port trong \`docs/upstream-registry.md\`:\n\n- ported: \`{d['ported']}\`\n- latest: \`{d['latest']}\`\n- extension liên quan: {', '.join('\`'+e+'\`' for e in d['exts'])}\n\nXử theo chế độ 3 (SYNC-UPSTREAM) của skill \`pi-ext-eval\`:\n1. Diff thật ref cũ → mới (tarball 2 version hoặc git diff 2 SHA) — KHÔNG đọc changelog thay diff\n2. Mini-brief ~10 dòng: đổi gì / chạm vùng đã port hay đã vượt / có mảnh xứng / đề xuất\n3. User quyết (mượn mảnh → tạo task port; không đáng → chỉ ghi kết luận)\n4. Cập nhật registry (ref mới + lần kiểm cuối) và \`docs/ext-eval-index.md\`\n\nIssue tự đóng khi registry hết drift. Tự sinh bởi workflow upstream-drift.\")
          ")
            if [ -n "${OPEN[$name]:-}" ]; then
              gh issue edit "${OPEN[$name]}" --body "$body" >/dev/null
              echo "updated #${OPEN[$name]} ($name)"
            else
              gh issue create --title "[upstream-sync] $name" --body "$body" --label upstream-sync >/dev/null
              echo "created issue ($name)"
            fi
          done

          # đóng issue hết drift
          for name in "${!OPEN[@]}"; do
            if ! grep -q "\"$name\"" drift.json; then
              gh issue close "${OPEN[$name]}" --comment "Drift đã xử lý (registry cập nhật ref) — đóng tự động bởi upstream-drift."
              echo "closed #${OPEN[$name]} ($name)"
            fi
          done
